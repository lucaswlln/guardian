<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta | Guardian</title>
  <link rel="icon" type="image/png" href="../images/GuardianHeroSimplified.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/cadastro.css">
</head>
<body>
  <main class="page">

    <section class="panel">
      <form class="card" id="signup-form" novalidate>
        <h2 class="card__title">Crie sua conta Guardian</h2>
        <p class="card__subtitle">Configure seu cofre seguro em um minuto.</p>

        <!-- Email -->
        <div class="field" data-field="email">
          <label for="email">Email</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.500"/><path d="m4 7.500 8 6 8-6"/></svg>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                   placeholder="exemplo@guardian.com" required aria-describedby="email-msg">
          </div>
          <p class="field__msg" id="email-msg" role="alert"></p>
        </div>

        <!-- Nome de usuário -->
        <div class="field" data-field="username">
          <label for="username">Nome de usuário</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.500" r="3.800"/><path d="M4.500 20c.8-3.700 3.800-5.800 7.500-5.800s6.700 2.100 7.500 5.800"/></svg>
            <input id="username" name="username" type="text" autocomplete="username"
                   placeholder="Exemplo: RedSun2003" minlength="3" maxlength="20" required aria-describedby="username-msg">
          </div>
          <p class="field__msg" id="username-msg" role="alert"></p>
        </div>

        <!-- Senha -->
        <div class="field" data-field="password">
          <label for="password">Senha Mestra</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.500" width="14" height="9.500" rx="2.500"/><path d="M8.500 10.500V8a3.500 3.500 0 0 1 7 0v2.500"/></svg>
            <input id="password" name="password" type="password" autocomplete="new-password"
                   placeholder="Pelo menos 8 caracteres" minlength="8" required aria-describedby="password-msg">
            <button type="button" class="input__toggle" data-toggle="password" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.600-6.500 10-6.500S22 12 22 12s-3.600 6.500-10 6.500S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength" id="strength" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <p class="field__msg" id="password-msg" role="alert"></p>
        </div>

        <!-- Confirmação de senha -->
        <div class="field" data-field="confirm">
          <label for="confirm">Confirme sua Senha Mestra</label>
          <div class="input">
            <svg class="input__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.500" width="14" height="9.500" rx="2.500"/><path d="M8.500 10.500V8a3.500 3.500 0 0 1 7 0v2.500"/></svg>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password"
                   placeholder="Repita sua senha mestra" required aria-describedby="confirm-msg">
            <button type="button" class="input__toggle" data-toggle="confirm" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.600-6.500 10-6.500S22 12 22 12s-3.600 6.500-10 6.500S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__msg" id="confirm-msg" role="alert"></p>
        </div>

        <p class="notice">
          Sua Senha Mestra não pode ser recuperada. O seu Guardian nunca armazena sua senha real, então guarde-a com cuidado.
        </p>

        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          CRIAR CONTA
        </button>

        <p class="card__footer">Já possui uma conta? <a href="login.html">Faça Login  </a></p>
      </form>
    </section>

  </main>
  <script src="../js/cadastro.js"></script>
</body>
</html>
