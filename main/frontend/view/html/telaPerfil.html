<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Guardian - Perfil</title>
    <link rel="icon" href="../images/GuardianHeroSimplified.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/telaPerfilStyle.css">
</head>
<body>
    <div class="container">

        <section id="sidebar"> <!-- SIDEBAR -->
            <div id = "logo">
                <img src="../images/GuardianHeroSimplified.png" alt="imagem da logo">
                <p class="titulos"><b>GUARDIAN</b></p>
            </div>

            <div id = "menu">
                <button class="botaoSelecionado" id="btnPerfil">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_36_2)">
                        <mask id="mask0_36_2" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="4" y="3" width="16" height="24">
                        <path d="M12 14.5C16.2442 14.5 19.5 17.2783 19.5 20.5C19.5 23.7217 16.2442 26.5 12 26.5C7.75585 26.5 4.5 23.7217 4.5 20.5C4.5 17.2783 7.75585 14.5 12 14.5Z" fill="#172554" stroke="#22D3EE"/>
                        <path d="M6.5 11C7.16667 8.66667 9.2 4 12 4C14.8 4 16.8333 8.66667 17.5 11C17.5 13 13.8333 15.1667 12 16C10.1667 15.1667 6.5 13 6.5 11Z" fill="#040819" stroke="#22D3EE"/>
                        <circle cx="12" cy="9" r="4" fill="#172554"/>
                        </mask>
                        <g mask="url(#mask0_36_2)">
                        <circle cx="12" cy="12" r="12" fill="#22D3EE"/>
                        <path d="M6.5 11C7.16667 8.66667 9.2 4 12 4C14.8 4 16.8333 8.66667 17.5 11C17.5 13 13.8333 15.1667 12 16C10.1667 15.1667 6.5 13 6.5 11Z" fill="#040819" stroke="#22D3EE"/>
                        <path d="M13 10H15V9L13 10Z" stroke="#22D3EE"/>
                        <path d="M11 10H9V9L11 10Z" stroke="#22D3EE"/>
                        </g>
                        </g>
                        <defs>
                        <clipPath id="clip0_36_2">
                        <rect width="24" height="24" fill="white"/>
                        </clipPath>
                        </defs>
                    </svg>

                    Perfil
                </button>
                <button class="botaoSidebar" id="btnContas">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.92529 5.92529L7.95029 7.95029M10.0503 7.95029L12.0753 5.92529M5.92529 12.0753L7.95029 10.0503M10.0503 10.0503L12.0753 12.0753M3.75 2.25H14.25C15.0784 2.25 15.75 2.92157 15.75 3.75V14.25C15.75 15.0784 15.0784 15.75 14.25 15.75H3.75C2.92157 15.75 2.25 15.0784 2.25 14.25V3.75C2.25 2.92157 2.92157 2.25 3.75 2.25ZM6 5.625C6 5.83211 5.83211 6 5.625 6C5.41789 6 5.25 5.83211 5.25 5.625C5.25 5.41789 5.41789 5.25 5.625 5.25C5.83211 5.25 6 5.41789 6 5.625ZM12.75 5.625C12.75 5.83211 12.5821 6 12.375 6C12.1679 6 12 5.83211 12 5.625C12 5.41789 12.1679 5.25 12.375 5.25C12.5821 5.25 12.75 5.41789 12.75 5.625ZM6 12.375C6 12.5821 5.83211 12.75 5.625 12.75C5.41789 12.75 5.25 12.5821 5.25 12.375C5.25 12.1679 5.41789 12 5.625 12C5.83211 12 6 12.1679 6 12.375ZM12.75 12.375C12.75 12.5821 12.5821 12.75 12.375 12.75C12.1679 12.75 12 12.5821 12 12.375C12 12.1679 12.1679 12 12.375 12C12.5821 12 12.75 12.1679 12.75 12.375ZM10.5 9C10.5 9.82843 9.82843 10.5 9 10.5C8.17157 10.5 7.5 9.82843 7.5 9C7.5 8.17157 8.17157 7.5 9 7.5C9.82843 7.5 10.5 8.17157 10.5 9Z" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
                    </svg>

                    Contas
                </button>
            </div>

            <div id = "logout">
                <button class="botaoSidebar" id="btnSair">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5.25L15.75 9L12 12.75M15.75 9H6.75M6.75 15.75H3.75C3.35218 15.75 2.97064 15.592 2.68934 15.3107C2.40804 15.0294 2.25 14.6478 2.25 14.25V3.75C2.25 3.35218 2.40804 2.97064 2.68934 2.68934C2.97064 2.40804 3.35218 2.25 3.75 2.25H6.75" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
                    </svg>

                    Sair
                </button>
            </div>
        </section>

        <section id="corpo">
            <div class="titulos" id="cabecalho"> <!-- CABEÇALHO -->
                Edite suas informações de perfil
            </div>

            <div id = "perfil">
                <img src="../images/GuardianHero.png" alt="">
                <div>
                    <p class="titulos" id="nomeUsuario">Nome do usuário Guardian</p>
                    <p id="trocarIMG">
                        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.125 8.5C2.125 6.80924 2.79665 5.18774 3.99219 3.99219C5.18774 2.79665 6.80924 2.125 8.5 2.125C10.2822 2.1317 11.9928 2.82712 13.2742 4.06583L14.875 5.66667M11.3333 5.66667H14.875V2.125M14.875 8.5C14.875 10.1908 14.2033 11.8123 13.0078 13.0078C11.8123 14.2033 10.1908 14.875 8.5 14.875C6.7178 14.8683 5.00719 14.1729 3.72583 12.9342L2.125 11.3333M2.125 14.875V11.3333H5.66667" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
                        </svg>

                        Trocar avatar
                    </p>
                </div>
            </div>

            <div id = blocos>
                <div id = "info">
                    <p>Email: (email do usuario)</p>
                    <p>Alterar Senha:</p>
                    <form action="" method="post" id="formAlterarSenha">
                        <input type="password" name="senhaAtual" class="inputs" placeholder="Senha atual">
                        <input type="password" name="novaSenha" class="inputs" placeholder="Nova senha">
                        <input type="password" name="confirmarSenha" class="inputs" placeholder="Confirmar nova senha">
                        <button type="submit" class="buttons">Alterar senha</button>
                    </form>
                </div>

                <div class="linhaVertical"></div>

                <div id="qtdSenhas">
                    <p>Quantidade de senhas salvas: (quantidade)</p>
                </div>
            </div>

        </section>

    </div>
</body>
</html>
